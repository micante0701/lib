<!doctype html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <meta name="description" content="佛說無量壽經">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿彌陀佛(計數器)</title>
    <link rel="icon" href="assets/icons/amitabha.png" type="image/png">
    <link rel="stylesheet" href="css/lib.css">
    <script src="js/book.js" defer></script>
    <!-- <script src="header.js" defer></script> -->
    <style>
        /* 數字區塊 */
        .divBtn {
            flex: 1;
            display: flex;
            justify-content: center;
            /* align-items: center; */
            align-items: flex-end;
            font-size: 3em;
            /* 無法選取 */
            user-select: none;
        }

        #countNum {
            /* 往上移動 20px */
            transform: translateY(-50px);
            font-family: "Arial";
        }

        /* 煙火特效文字的樣式 */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 12rem;
            /* color: #ff4757; */
            color: rgba(255, 255, 0, 0.841);
            pointer-events: none;
            /* 避免阻擋滑鼠點擊 */
            transform: translate(-50%, -50%);
            /* 讓文字中心對準滑鼠點擊位置 */
            animation: firework 0.6s ease-out forwards;
        }

        /* 原地放大並淡出的煙火動畫 */
        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.3);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* 手機版樣式 */
        @media screen and (max-width: 768px) {
            .floating-text {
                font-size: 8rem;
            }
        }
    </style>
</head>

<body style="margin:0; display:flex; flex-direction:column; height:100vh;">
    <!-- <div id="header">
    </div> -->
    <div>
        <a class="floating-btn mouse settingEmoji" id="btnPos1" onclick="togglePopup()">⚙</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos2" href="#top">↑</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos3" href="#bottom">↓</a>
        <div id="overlay" class="overlay" onclick="closePopup(event)">
            <span id="toolbox" class="overlay-content">
                <p>
                    <a href="tools.html">返回工具列表</a>
                </p>
                <p>
                <figure>
                    <figcaption>背景音</figcaption>
                    <audio controls loop src="assets/audio/amitabha.mp3"></audio>
                </figure>
                <br>
                <span>護眼模式</span>
                <br>
                <button class="mouse btnTheme" onclick="toggleTheme()" id="themePicker">開/關</button>
                <br>
                <span>文字大小</span>
                <br>
                <span>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(1)">+</button>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(-1)">-</button>
                </span>
                <br>
                <label for="toc">章節目錄</label>
                <br>
                <select id="toc">
                    <option value="">-- 請選擇 --</option>
                </select>
                <br>
                </p>
                <!-- <p>
                    <a href="pair.html">雙頁對照檢視</a>
                </p> -->
                <button class="mouse " id="reset" style="font-size: 2rem;">離線瀏覽更新</button>
            </span>
        </div>
    </div>
    <div id="top">
        <h1>計數器3</h1>
    </div>
    <div id="countBtn" class="divBtn">
        <div id="countNum">5000</div>
    </div>
    <script>
        // 點擊事件
        const count = document.getElementById("countBtn");
        count.addEventListener("click", () => {
            addNum()
        });
        // #countNum 數字+1
        function addNum() {
            const n = document.getElementById("countNum")
            n.innerText = parseInt(n.textContent, 10) - 1;
        }

        // ★ ★ ★ 更改數字區 ★ ★ ★ //
        let pressTimer = null;
        const longPressDuration = 800; // 長按時間門檻（毫秒）

        // --- 長按相關事件監聽 (支援滑鼠與手機觸控) ---
        count.addEventListener("mousedown", startLongPress);
        count.addEventListener("touchstart", startLongPress);

        count.addEventListener("mouseup", cancelLongPress);
        count.addEventListener("mouseleave", cancelLongPress);
        count.addEventListener("touchend", cancelLongPress);
        count.addEventListener("touchmove", cancelLongPress); // 手指滑動時取消長按

        function startLongPress(e) {
            // 防止手機觸控時同時觸發預設行為或滑鼠事件
            // e.preventDefault(); 

            // 清除可能殘留的計時器
            cancelLongPress();

            pressTimer = setTimeout(() => {
                // 長按觸發的動作
                showPromptInput();
            }, longPressDuration);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // 彈出視窗輸入並改變數字
        function showPromptInput() {
            const n = document.getElementById("countNum");
            const currentVal = n.textContent;

            // 跳出輸入視窗
            let userInput = prompt("請輸入要設定的數字：", currentVal);

            // 確保使用者有輸入且按下確定（點擊取消則 userInput 為 null）
            if (userInput !== null) {
                let parsedNum = parseInt(userInput, 10);

                // 檢查輸入是否為有效數字
                if (!isNaN(parsedNum)) {
                    n.innerText = parsedNum;
                } else {
                    alert("請輸入有效的數字！");
                }
            }
        }
    </script>
</body>

</html>
