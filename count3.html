<!doctype html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <meta name="description" content="佛說無量壽經">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿彌陀佛(計數器)</title>
    <link rel="icon" href="assets/icons/amitabha.png" type="image/png">
    <link rel="stylesheet" href="css/lib.css">
    <script src="js/book.js" defer></script>
    <!-- <script src="header.js" defer></script> -->
    <style>
        body {
            margin: 0;
            height: 100vh;
        }

        /*  */
        .countArea {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 數字區塊容器 */
        .divBtn {
            flex: 1;
            position: relative;
            /* 作為內部絕對定位的參考基準 */
            display: block;
            /* 避免 flex 影響內部子元素的預設排列 */
            user-select: none;
        }

        /* 讓 #showText 佔滿整個區塊並置中特效文字 */
        #showText {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ★ 點擊就會穿透過去點到底下的按鈕 */
            pointer-events: none;
        }

        /* 計數數字區 */
        #countNum {
            position: absolute;
            bottom: 20px;
            /* 距離底部 20px */
            left: 50%;
            /* 靠左 50% */
            transform: translateX(-50%);
            /* 水平置中校正 */
            font-size: 3em;
            font-family: "Arial";
        }

        /* 煙火特效文字的樣式 */
        .floating-text {
            position: absolute;
            left: 50%;
            /* 加上這行：水平置中 */
            top: 50%;
            /* 加上這行：垂直置中 */
            font-weight: bold;
            font-size: 18rem;
            color: rgba(255, 255, 0, 0.841);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: firework 0.6s ease-out forwards;
        }

        /* 原地放大並淡出的煙火動畫 */
        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.3);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* 手機版樣式 */
        @media screen and (max-width: 768px) {
            .floating-text {
                font-size: 12rem;
                /* bottom: -20px; */
            }
        }
    </style>
</head>

<body>
    <!-- <div id="header">
    </div> -->
    <div>
        <a class="floating-btn mouse settingEmoji" id="btnPos1" onclick="togglePopup()">⚙</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos2" href="#top">↑</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos3" href="#bottom">↓</a>
        <div id="overlay" class="overlay" onclick="closePopup(event)">
            <span id="toolbox" class="overlay-content">
                <p>
                    <a href="tools.html">返回工具列表</a>
                </p>
                <p>
                <figure>
                    <figcaption>背景音</figcaption>
                    <audio controls loop src="assets/audio/amitabha.mp3"></audio>
                </figure>
                <br>
                <span>護眼模式</span>
                <br>
                <button class="mouse btnTheme" onclick="toggleTheme()" id="themePicker">開/關</button>
                <br>
                <span>文字大小</span>
                <br>
                <span>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(1)">+</button>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(-1)">-</button>
                </span>
                <br>
                <label for="toc">章節目錄</label>
                <br>
                <select id="toc">
                    <option value="">-- 請選擇 --</option>
                </select>
                <br>
                </p>
                <!-- <p>
                    <a href="pair.html">雙頁對照檢視</a>
                </p> -->
                <button class="mouse " id="reset" style="font-size: 2rem;">離線瀏覽更新</button>
            </span>
        </div>
    </div>
    <div id="divCountArea" class="countArea">
        <div id="top">
            <h1>計數器3</h1><button onclick="saveEnergy()">CLICK</button>
        </div>
        <div>
            <div id="showText"></div>
        </div>
        <div class="divBtn">
            <div id="countNum">0</div>
        </div>
    </div>
    <script>
        // ★ ★ ★ 省電模式 ★ ★ ★ //
        const s = document.getElementsByTagName("h1")[0];
        s.addEventListener("click", () => {
            saveEnergy();
        });

        function saveEnergy() {
            // const b = document.getElementsByTagName("body")[0];
            // b.style.backgroundColor = "black";
            // document.getElementById("top").style.color = "white";
            // document.getElementById("countNum").style.color = "white";

            // 直接使用 document.body 更改背景
            document.body.style.backgroundColor = "black";

            // 更改文字顏色
            document.getElementById("top").style.color = "white";
            document.getElementById("countNum").style.color = "white";
        }

        // ★ ★ ★ 主程式 ★ ★ ★ //

        const count = document.getElementById("divCountArea");
        const showTextDiv = document.getElementById("showText");
        const textArray = ["阿", "彌", "陀", "佛"];
        let currentIndex = 0; // 記錄目前要顯示到第幾個字
        let resetTimer = null; // 用來存放 5 秒倒數的計時器變數

        count.addEventListener("click", (e) => {
            // 1. 顯示特效文字（固定在 #showText 範圍內）
            showFloatingText();

            // 2. 每次點擊都換下一個字，當完成一輪時 currentIndex 變成 0，數字才 +1
            currentIndex = (currentIndex + 1) % textArray.length;

            if (currentIndex === 0) {
                addNum();
            }

            // --- 3. 處理 3 秒無點擊自動重置的邏輯 ---
            clearTimeout(resetTimer);

            resetTimer = setTimeout(() => {
                currentIndex = 0; // 恢復初始索引
                console.log("超過 2 秒未點擊，已自動重置狀態");
            }, 2000); // 2000 毫秒 = 2 秒
        });

        function addNum() {
            const n = document.getElementById("countNum");
            const newNum = parseInt(n.textContent, 10) + 1;
            n.innerText = newNum;
            // 每次增加時同步存入 localStorage
            localStorage.setItem("count3_Value", newNum);
        }

        function showFloatingText() {
            const span = document.createElement("span");
            span.className = "floating-text";

            // 顯示當前字串
            span.innerText = textArray[currentIndex];

            // 直接塞進 #showText 容器中，配合 CSS 置中與動畫
            showTextDiv.appendChild(span);

            // 動畫結束後（0.6秒後）自動刪除 DOM 元素
            setTimeout(() => {
                span.remove();
            }, 600);
        }

        // ★ ★ ★ 偵測起始值 ★ ★ ★ //
        // 1. 網頁一載入就從 localStorage 讀取並恢復數字
        window.addEventListener("DOMContentLoaded", () => {
            const savedNum = localStorage.getItem("count3_Value");
            if (savedNum !== null) {
                document.getElementById("countNum").innerText = savedNum;
            }
        });

        // ★ ★ ★ 更改數字區 ★ ★ ★ //
        let pressTimer = null;
        const longPressDuration = 800; // 長按時間門檻（毫秒）

        // --- 長按相關事件監聽 (支援滑鼠與手機觸控) ---
        count.addEventListener("mousedown", startLongPress);
        count.addEventListener("touchstart", startLongPress);

        count.addEventListener("mouseup", cancelLongPress);
        count.addEventListener("mouseleave", cancelLongPress);
        count.addEventListener("touchend", cancelLongPress);
        count.addEventListener("touchmove", cancelLongPress); // 手指滑動時取消長按

        function startLongPress(e) {
            cancelLongPress();

            pressTimer = setTimeout(() => {
                showPromptInput();
            }, longPressDuration);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // 彈出視窗輸入並改變數字
        function showPromptInput() {
            const n = document.getElementById("countNum");
            const currentVal = n.textContent;

            let userInput = prompt("請輸入要設定的數字：", currentVal);

            if (userInput !== null) {
                let parsedNum = parseInt(userInput, 10);

                if (!isNaN(parsedNum)) {
                    n.innerText = parsedNum;
                } else {
                    alert("請輸入有效的數字！");
                }
            }
        }



        // ★ ★ ★ 滑動跳頁轉換功能 ★ ★ ★ //

        // 1. 記錄按下的起始位置與結束位置
        let startX = 0;
        let endX = 0;

        // 設定觸發滑動的最短距離（像素），避免稍微碰到就誤判
        const minDistance = 50;

        // 2. 監聽「手指按下」事件
        document.addEventListener('touchstart', function (e) {
            // 取得第一隻手指觸碰的位置
            startX = e.touches[0].clientX;
        }, false);

        // 3. 監聽「手指離開」事件
        document.addEventListener('touchend', function (e) {
            // 取得手指離開時的位置
            endX = e.changedTouches[0].clientX;

            // 計算滑動距離與方向
            handleSwipe();
        }, false);

        // 4. 判斷滑動方向的函式
        function handleSwipe() {
            let distance = endX - startX;

            // 如果滑動距離大於設定的最小值，才認定為有效滑動
            if (Math.abs(distance) > minDistance) {
                if (distance < 0) {
                    // 起始點比結束點大（往左劃）
                    window.location.href = "count.html";
                } else {
                    // 起始點比結束點小（往右劃）
                    window.location.href = "count.html";
                }
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === "ArrowLeft") {
                window.location.href = "count.html";
            }
            if (e.key === "ArrowRight") {
                window.location.href = "count.html";
            };
        });
    </script>
</body>

</html>
