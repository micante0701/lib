    <style>
        /* 1. 預設模式（白色背景） */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            /* 預設改為白色 */
            color: #000000;
            user-select: none;
            /* 取消註解：防止連續快速點擊時數字被選取反白 */
            transition: background-color 0.3s, color 0.3s;
        }

        /* 2. 深色模式（純黑省電） */
        body.dark-mode {
            background-color: black;
            color: #ffffff;
        }

        /* 計數區域涵蓋全螢幕 */
        .countArea {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #top {
            padding-top: 20px;
        }

        #top h1 {
            cursor: pointer;
            /* 讓滑鼠移上去呈現點擊手勢 */
        }

        /* 數字區塊 */
        .divBtn {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            width: 100%;
        }

        #countNum {
            font-family: "Arial";
            /* 自動依螢幕寬度拉大數字 */
            font-size: 20vw;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- <div id="header">
    </div> -->
    <div>
        <a class="floating-btn mouse settingEmoji" id="btnPos1" onclick="togglePopup()">⚙</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos2" href="#top">↑</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos3" href="#bottom">↓</a>
        <div id="overlay" class="overlay" onclick="closePopup(event)">
            <span id="toolbox" class="overlay-content">
                <p>
                    <a href="tools.html">返回工具列表</a>
                </p>
                <p>
                <figure>
                    <figcaption>背景音</figcaption>
                    <audio controls loop src="assets/audio/amitabha.mp3"></audio>
                </figure>
                <br>
                <span>護眼模式</span>
                <br>
                <button class="mouse btnTheme" onclick="toggleTheme()" id="themePicker">開/關</button>
                <br>
                <span>計數器加總</span>
                <br>
                <button class="mouse btnTheme" onclick="sumAllcounters()">啟動</button>
                <!-- <span>文字大小</span>
                <br>
                <span>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(1)">+</button>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(-1)">-</button>
                </span>
                <br>
                <label for="toc">章節目錄</label>
                <br>
                <select id="toc">
                    <option value="">-- 請選擇 --</option>
                </select> -->
                <br>
                </p>
                <!-- <p>
                    <a href="pair.html">雙頁對照檢視</a>
                </p> -->
                <button class="mouse " id="reset" style="font-size: 2rem;">離線瀏覽更新</button>
            </span>
        </div>
    </div>
    <div id="divCountArea" class="countArea">
        <div id="top">
            <h1 onclick="test(document.body)">計數器1</h1>
        </div>
        <div class="divBtn">
            <div id="countNum">0</div>
        </div>
    </div>

    <script>
        // ↓ ↓ ↓ 偵測起始值 ↓ ↓ ↓ //

        // 取得計數器「起始值」
        window.addEventListener("DOMContentLoaded", () => {
            const startNum = localStorage.getItem("count1_Value");

            if (startNum !== null) {
                document.getElementById("countNum").innerText = startNum;
            }
        });

        // 取得背景顏色
        const savedTheme = localStorage.getItem('userTheme');
        if (savedTheme === 'black') {
            document.body.classList.add('dark-mode');
        }

        // ↑ ↑ ↑ 偵測起始值 ↑ ↑ ↑ //

        // ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★

        // ↓ ↓ ↓ 計數(點1+1) ↓ ↓ ↓ //

        // 點擊事件
        const count = document.getElementById("divCountArea");
        count.addEventListener("click", () => {
            addNum()
        });

        // #countNum 數字+1
        function addNum() {
            const n = document.getElementById("countNum")
            const newNum = parseInt(n.textContent, 10) + 1;
            n.innerText = newNum;
            // 每次增加時同步存入 localStorage
            localStorage.setItem("count1_Value", newNum);
        }

        // ↑ ↑ ↑ 計數(點1+1) ↑ ↑ ↑ //

        // ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★

        // ↓ ↓ ↓ 計數器加總 ↓ ↓ ↓ //

        // 加總所有計數器
        function sumAllcounters() {
            // 取得現有數值，若無則預設為 0
            const a = parseInt(localStorage.getItem("count1_Value"), 10) || 0;
            const b = parseInt(localStorage.getItem("count2_Value"), 10) || 0;
            const c = parseInt(localStorage.getItem("count3_Value"), 10) || 0;
            const d = parseInt(localStorage.getItem("count4_Value"), 10) || 0;
            // 計算總和
            const sumAll = a + b + c + d;
            // 更新 localStorage
            localStorage.setItem("count1_Value", sumAll); // 總和成為 count1 的新數據
            localStorage.setItem("count2_Value", 0); // 歸零
            localStorage.setItem("count3_Value", 0); // 歸零
            localStorage.setItem("count4_Value", 0); // 歸零
            // 刷新數字
            document.getElementById("countNum").innerText = sumAll;
            // 關閉
        }

        // ↑ ↑ ↑ 計數器加總 ↑ ↑ ↑ //

        // ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★

        // ↓ ↓ ↓ 省電模式 ↓ ↓ ↓ //

        // 設定並套用顏色的函式

        function test(element) {
            // 取得元素計算後的背景顏色，並轉小寫、去除空白
            const bgColor = window.getComputedStyle(element)
                .backgroundColor
                .toLowerCase()
                .replace(/\s+/g, '');

            // 判斷是否為黑色
            const isBlack = ['black', '#000000', '#000', 'rgb(0,0,0)', 'rgba(0,0,0,1)'].includes(bgColor);

            // 取得 DOM 元素（重複使用的元素先存成變數）
            const topEl = document.getElementById("top");
            const countNumEl = document.getElementById("countNum");

            if (isBlack) {
                // 當前是黑色 -> 切換為淺色主題
                document.body.style.backgroundColor = "rgb(211, 208, 156)";
                if (topEl) topEl.style.color = "black";
                if (countNumEl) countNumEl.style.color = "black";
            } else {
                // 當前不是黑色（包含白色或其他顏色） -> 切換為深色主題
                document.body.style.backgroundColor = "black";
                if (topEl) topEl.style.color = "#ffffff";
                if (countNumEl) countNumEl.style.color = "#ffffff";
            }
        }


        function toggleBackgroundColor(e) {
            // ★ 核心修復：阻止事件冒泡！點標題時「不會」觸發外層 divCountArea 的 +1
            if (e) e.stopPropagation();

            const isDark = document.body.classList.toggle('dark-mode');

            if (isDark) {
                localStorage.setItem('userTheme', 'black');
            } else {
                localStorage.setItem('userTheme', 'white');
            }



        }

        // ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★

        // ↓ ↓ ↓ 更改數字區 ↓ ↓ ↓ //

        let pressTimer = null;
        const longPressDuration = 800; // 長按時間門檻（毫秒）

        // --- 長按相關事件監聽 (支援滑鼠與手機觸控) ---
        count.addEventListener("mousedown", startLongPress);
        count.addEventListener("touchstart", startLongPress);

        count.addEventListener("mouseup", cancelLongPress);
        count.addEventListener("mouseleave", cancelLongPress);
        count.addEventListener("touchend", cancelLongPress);
        count.addEventListener("touchmove", cancelLongPress); // 手指滑動時取消長按

        function startLongPress(e) {
            // 防止手機觸控時同時觸發預設行為或滑鼠事件
            // e.preventDefault(); 

            // 清除可能殘留的計時器
            cancelLongPress();

            pressTimer = setTimeout(() => {
                // 長按觸發的動作
                showPromptInput();
            }, longPressDuration);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // 彈出視窗輸入並改變數字
        function showPromptInput() {
            const n = document.getElementById("countNum");
            const currentVal = n.textContent;

            // 跳出輸入視窗
            let userInput = prompt("請輸入欲修正的「數量(數字)」：", currentVal);

            // 確保使用者有輸入且按下確定（點擊取消則 userInput 為 null）
            if (userInput !== null) {
                let parsedNum = parseInt(userInput, 10);

                // 檢查輸入是否為有效數字
                if (!isNaN(parsedNum)) {
                    n.innerText = parsedNum;
                } else {
                    alert("請輸入有效的「數字」！");
                }
            }
        }

        // ↑ ↑ ↑ 更改數字區 ↑ ↑ ↑ //

        // ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★

        // ↓ ↓ ↓ 滑動跳頁轉換功能 ↓ ↓ ↓ //

        // 1. 記錄按下的起始位置與結束位置
        let startX = 0;
        let endX = 0;

        // 設定觸發滑動的最短距離（像素），避免稍微碰到就誤判
        const minDistance = 50;

        // 2. 監聽「手指按下」事件
        document.addEventListener('touchstart', function (e) {
            // 取得第一隻手指觸碰的位置
            startX = e.touches[0].clientX;
        }, false);

        // 3. 監聽「手指離開」事件
        document.addEventListener('touchend', function (e) {
            // 取得手指離開時的位置
            endX = e.changedTouches[0].clientX;

            // 計算滑動距離與方向
            handleSwipe();
        }, false);

        // 4. 判斷滑動方向的函式
        function handleSwipe() {
            let distance = endX - startX;

            // 如果滑動距離大於設定的最小值，才認定為有效滑動
            if (Math.abs(distance) > minDistance) {
                if (distance < 0) {
                    // 起始點比結束點大（往左劃）
                    window.location.href = "count3.html";
                } else {
                    // 起始點比結束點小（往右劃）
                    window.location.href = "count3.html";
                }
            }
        }

        // 電腦版左右鍵
        document.addEventListener('keydown', function (e) {
            if (e.key === "ArrowLeft") {
                window.location.href = "count3.html";
            }
            if (e.key === "ArrowRight") {
                window.location.href = "count3.html";
            };
        });

    </script>
</body>
