<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Lakeshore</title>
  <link rel="stylesheet" href="css/resto.css">
  <script src="js/resto.js" defer></script>
</head>

<body>

  <div class="top-bar">
    <div>
      <h1>Le Lakeshore</h1>
      <p style="color: #666; font-size: 0.9rem;">請點擊桌號進入點餐介面</p>
    </div>
    <button id="btn-open-history" class="btn-history">本日消費紀錄</button>
  </div>

  <div id="table-grid" class="table-grid"></div>

  <!-- 1. 點餐介面 Overlay -->
  <div id="order-overlay" class="overlay">
    <div class="order-modal">
      <div class="order-header">
        <h2 id="modal-table-title">桌號</h2>
        <div class="guest-control">
          <label for="guest-count">人數：</label>
          <input type="number" id="guest-count" min="1" value="1">
        </div>
      </div>
      <div class="order-body">
        <div class="cart-section">
          <div id="cart-list" class="cart-list"></div>
          <div class="cart-footer">
            <div id="min-charge-info" class="min-charge-info"></div>
            <div id="total-price" class="total-price">總計：$0</div>
            <div class="action-btns">
              <button id="btn-submit-order" class="btn-submit">出單</button>
              <button id="btn-checkout" class="btn-checkout">結帳清空</button>
            </div>
          </div>
        </div>
        <div class="menu-section">
          <div id="category-tabs" class="category-tabs"></div>
          <div id="menu-grid" class="menu-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 備註選擇/套餐選擇彈窗 -->
  <div id="note-overlay" class="overlay">
    <div class="note-modal">
      <h3 id="note-title">選擇選項</h3>
      <div id="note-options-container"></div>
      <div class="note-actions">
        <button id="btn-cancel-note" class="btn-secondary">取消</button>
        <button id="btn-save-note" class="btn-primary">確定</button>
      </div>
    </div>
  </div>

  <!-- 3. 獨立飲料冰糖選擇 Overlay (針對需求2) -->
  <div id="drink-opt-overlay" class="overlay">
    <div class="drink-opt-modal">
      <h3>飲料冰糖客製化</h3>
      <div id="drink-opt-container" class="sub-customization" style="margin-top:15px;"></div>
      <div class="note-actions">
        <button id="btn-save-drink-opt" class="btn-primary">確定</button>
      </div>
    </div>
  </div>

  <!-- 4. 本日歷史紀錄彈窗 -->
  <div id="history-overlay" class="overlay">
    <div class="history-modal">
      <h2>本日結帳歷史紀錄</h2>
      <div id="history-list" class="history-list"></div>
      <div style="text-align: right; margin-top: 10px;">
        <button id="btn-close-history" class="btn-secondary">關閉</button>
      </div>
    </div>
  </div>

  <script>

  </script>
</body>

</html>
