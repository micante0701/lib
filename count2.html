<!doctype html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <meta name="description" content="佛說無量壽經">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿彌陀佛(計數器)</title>
    <link rel="icon" href="assets/icons/amitabha.png" type="image/png">
    <link rel="stylesheet" href="css/lib.css">
    <script src="js/book.js" defer></script>
    <!-- <script src="header.js" defer></script> -->
    <style>
        /* 數字區塊 */
        .divBtn {
            flex: 1;
            display: flex;
            justify-content: center;
            /* align-items: center; */
            align-items: flex-end;
            font-size: 3em;
            /* 無法選取 */
            user-select: none;
        }

        #countNum {
            /* 往上移動 20px */
            transform: translateY(-50px);
            font-family: "Arial";
        }

        /* 煙火特效文字的樣式 */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 12rem;
            /* color: #ff4757; */
            color: rgba(255, 255, 0, 0.841);
            pointer-events: none;
            /* 避免阻擋滑鼠點擊 */
            transform: translate(-50%, -50%);
            /* 讓文字中心對準滑鼠點擊位置 */
            animation: firework 0.6s ease-out forwards;
        }

        /* 原地放大並淡出的煙火動畫 */
        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.3);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* 手機版樣式 */
        @media screen and (max-width: 768px) {
            .floating-text {
                font-size: 8rem;
            }
        }
    </style>
</head>

<body style="margin:0; display:flex; flex-direction:column; height:100vh;">
    <!-- <div id="header">
    </div> -->
    <div>
        <a class="floating-btn mouse settingEmoji" id="btnPos1" onclick="togglePopup()">⚙</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos2" href="#top">↑</a>
        <a class="floating-btn mouse settingEmoji" id="btnPos3" href="#bottom">↓</a>
        <div id="overlay" class="overlay" onclick="closePopup(event)">
            <span id="toolbox" class="overlay-content">
                <p>
                    <a href="index.html">回首頁</a>
                </p>
                <p>
                <figure>
                    <figcaption>背景音</figcaption>
                    <audio controls loop src="assets/audio/amitabha.mp3"></audio>
                </figure>
                <br>
                <span>護眼模式</span>
                <br>
                <button class="mouse btnTheme" onclick="toggleTheme()" id="themePicker">開/關</button>
                <br>
                <span>文字大小</span>
                <br>
                <span>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(1)">+</button>
                    <button class="mouse toolboxBtn" onclick="changeFontSize(-1)">-</button>
                </span>
                <br>
                <label for="toc">章節目錄</label>
                <br>
                <select id="toc">
                    <option value="">-- 請選擇 --</option>
                </select>
                <br>
                </p>
                <!-- <p>
                    <a href="pair.html">雙頁對照檢視</a>
                </p> -->
                <button class="mouse " id="reset" style="font-size: 2rem;">離線瀏覽更新</button>
            </span>
        </div>
    </div>
    <div id="top">
        <h1>計數器</h1>
    </div>
    <div id="countBtn" class="divBtn">
        <div id="countNum">0</div>
    </div>
    <script>
        // const count = document.getElementById("countBtn");
        // const textArray = ["阿", "彌", "陀", "佛"];
        // let currentIndex = 0; // 記錄目前要顯示到第幾個字

        // count.addEventListener("click", (e) => {
        //     // 1. 顯示特效文字
        //     showFloatingText(e.clientX, e.clientY);

        //     // 2. 每次點擊都換下一個字，當完成一輪（回到 "歡" 時，也就是 currentIndex 變成 0）數字才 +1
        //     currentIndex = (currentIndex + 1) % textArray.length;

        //     if (currentIndex === 0) {
        //         addNum();
        //     }
        // });

        const count = document.getElementById("countBtn");
        const textArray = ["阿", "彌", "陀", "佛"];
        let currentIndex = 0; // 記錄目前要顯示到第幾個字
        let resetTimer = null; // 用來存放 5 秒倒數的計時器變數

        count.addEventListener("click", (e) => {
            // 1. 顯示特效文字
            showFloatingText(e.clientX, e.clientY);

            // 2. 每次點擊都換下一個字，當完成一輪時 currentIndex 變成 0，數字才 +1
            currentIndex = (currentIndex + 1) % textArray.length;

            if (currentIndex === 0) {
                addNum();
            }

            // --- 3. 處理 5 秒無點擊自動重置的邏輯 ---

            // 清除上一次還沒跑完的 5 秒計時器
            clearTimeout(resetTimer);

            // 重新設定一個 5 秒後的計時器
            resetTimer = setTimeout(() => {
                currentIndex = 0; // 恢復初始索引
                console.log("超過 3 秒未點擊，已自動重置狀態");
            }, 3000); // 3000 毫秒 = 3 秒
        });

        function addNum() {
            const n = document.getElementById("countNum");
            n.innerText = parseInt(n.textContent, 10) + 1;
        }

        function showFloatingText(x, y) {
            const span = document.createElement("span");
            span.className = "floating-text";

            // 顯示當前字串
            span.innerText = textArray[currentIndex];

            // 設定在滑鼠點擊的座標
            span.style.left = `${x}px`;
            span.style.top = `${y}px`;

            document.body.appendChild(span);

            // 動畫結束後（0.6秒後）自動刪除 DOM 元素
            setTimeout(() => {
                span.remove();
            }, 600);
        }

        // ★ ★ ★ 更改數字區 ★ ★ ★ //
        let pressTimer = null;
        const longPressDuration = 800; // 長按時間門檻（毫秒）

        // --- 長按相關事件監聽 (支援滑鼠與手機觸控) ---
        count.addEventListener("mousedown", startLongPress);
        count.addEventListener("touchstart", startLongPress);

        count.addEventListener("mouseup", cancelLongPress);
        count.addEventListener("mouseleave", cancelLongPress);
        count.addEventListener("touchend", cancelLongPress);
        count.addEventListener("touchmove", cancelLongPress); // 手指滑動時取消長按

        function startLongPress(e) {
            // 防止手機觸控時同時觸發預設行為或滑鼠事件
            // e.preventDefault(); 

            // 清除可能殘留的計時器
            cancelLongPress();

            pressTimer = setTimeout(() => {
                // 長按觸發的動作
                showPromptInput();
            }, longPressDuration);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // 彈出視窗輸入並改變數字
        function showPromptInput() {
            const n = document.getElementById("countNum");
            const currentVal = n.textContent;

            // 跳出輸入視窗
            let userInput = prompt("請輸入要設定的數字：", currentVal);

            // 確保使用者有輸入且按下確定（點擊取消則 userInput 為 null）
            if (userInput !== null) {
                let parsedNum = parseInt(userInput, 10);

                // 檢查輸入是否為有效數字
                if (!isNaN(parsedNum)) {
                    n.innerText = parsedNum;
                } else {
                    alert("請輸入有效的數字！");
                }
            }
        }
    </script>
</body>

</html>
