<!doctype html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <meta name="description" content="阿彌陀佛(計數器)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿彌陀佛(計數器)</title>
    <link rel="icon" href="assets/icons/amitabha.png" type="image/png">
    <link rel="stylesheet" href="css/tools.css">
    <script src="js/tools.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* background-color: black; */
            transition: background-color 0.9s, color 0.9s;
            overflow: hidden;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;

            user-select: none;
            /* 針對 Safari / iOS */
            -webkit-user-select: none;

            background-image: url(assets/images/amitabha_desk.png);
            background-repeat: no-repeat;
            background-size: contain;
            background-size: cover;
            /* transition: background-position 2s ease; */
            transition: background-position 2s ease, background-color 2s ease, background-image 2s ease;
        }

        /* 預設文字顏色 */
        #top,
        #count-times {
            color: black;
        }

        .container.dark-theme {
            /* 移除原本的圖片 */
            background-image: none;
            /* 改成純黑色背景 */
            background-color: black;

        }

        .container.dark-theme #top,
        .container.dark-theme #count-times {
            color: white;
        }

        .banner-top,
        .banner-center,
        .banner-foot {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner-top {
            height: 15vh;
            font-size: 5vh;
            font-weight: bold;
        }

        .banner-center {
            height: 0vh;
        }

        .banner-foot {
            height: 85vh;
            font-size: 20vh;
            font-family: "Arial";
        }

        /* 平滑過渡效果 */
        .banner-center,
        .banner-foot {
            transition: height 0.5s ease;
        }

        /* 觸發後的狀態 */
        .banner-center.active {
            height: 60vh;
        }

        .banner-foot.active {
            height: 25vh;
        }

        /* 煙火特效文字的樣式 */
        .floating-text {
            position: absolute;
            left: 50%;
            /* 加上這行：水平置中 */
            top: 50%;
            /* 加上這行：垂直置中 */
            font-weight: bold;
            font-size: 18rem;
            color: rgba(255, 255, 0, 0.841);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: firework 0.6s ease-out forwards;
        }

        /* 原地放大並淡出的煙火動畫 */
        @keyframes firework {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.3);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        /* 手機版樣式 */
        @media screen and (max-width: 768px) {
            .floating-text {
                font-size: 12rem;
                /* bottom: -20px; */
            }

            .container{
                background-image: url(assets/images/amitabha.png);
            }
        }
                
        /* 手機模式 */
        @media screen and (max-width: 768px) {
            .container {
                background-position: 10% center;
                transition: background-position 2s ease;
            }

            .banner-top {
                height: 10vh;
            }

            .banner-foot {
                height: 90vh;
                font-size: 15vh;
            }
        }
    </style>
</head>

    <div>
        <a class="floating-btn mouse settingEmoji" id="btnPos1" onclick="togglePopup()">⚙</a>

        <!-- <a class="floating-btn mouse settingEmoji" id="btnPos3" href="#bottom">↓</a> -->
        <div id="overlay" class="overlay" onclick="closePopup(event)">
            <span id="toolbox" class="overlay-content">
                <a href="tools.html">返回工具列表</a>
                <figure>
                    <figcaption>背景音</figcaption>
                    <audio controls loop src="assets/audio/amitabha.mp3"></audio>
                </figure>
                <span>計數「歸零」</span>
                <button class="mouse btnTheme" onclick="resetToZero()">歸零</button>
                <span>計數「加總」</span>
                <button class="mouse btnTheme" onclick="sumAllcounters()">啟動</button>
                <button class="mouse" id="reset">離線瀏覽更新</button>
            </span>
        </div>

    <div class="container" id="area-count">
        <div class="banner-top">
            <p onclick="toggleTheme()" id="top">南無阿彌陀佛</p>
        </div>
        <div class="banner-center">
            <div id="showText"></div>
        </div>
        <div class="banner-foot">
            <p class="count-number" id="count-times">0</p>
        </div>
    </div>

    <script>
        const count = document.getElementById("area-count");
        const showTextDiv = document.getElementById("showText");
        const textArray = ["阿", "彌", "陀", "佛"];
        let currentIndex = 0; // 記錄目前要顯示到第幾個字
        let resetTimer = null; // 用來存放 5 秒倒數的計時器變數

        // 1. 顯示特效文字函式
        function showFloatingText() {
            const span = document.createElement("span");
            span.className = "floating-text";

            // 顯示當前字串
            span.innerText = textArray[currentIndex];

            // 直接塞進 #showText 容器中，配合 CSS 置中與動畫
            showTextDiv.appendChild(span);

            // 動畫結束後（0.6秒後）自動刪除 DOM 元素
            setTimeout(() => {
                span.remove();
            }, 600);
        }

        // <!-- ★ 修改：點擊事件判斷 toggleBanner 狀態 -->
        count.addEventListener("click", (e) => {
            // 如果點到的是標題 (top)，只觸發 toggleTheme()，不觸發文字與計數
            if (e.target.id === "top") return;

            // <!-- ★ 新增：檢查 .banner-center 是否有 'active' 類別 -->
            const bannerCenter = document.querySelector('.banner-center');
            const isBannerActive = bannerCenter && bannerCenter.classList.contains('active');

            if (isBannerActive) {
                // 【展開狀態】：顯示特效文字，唸完一輪 (臨 -> 歡) 數字才 +1
                showFloatingText();

                currentIndex = (currentIndex + 1) % textArray.length;

                if (currentIndex === 0) {
                    addNum();
                }

                // 2 秒無點擊自動重置文字進度
                clearTimeout(resetTimer);
                resetTimer = setTimeout(() => {
                    currentIndex = 0;
                    console.log("超過 2 秒未點擊，已自動重置狀態");
                }, 2000); 

            } else {
                // 【關閉狀態】：不顯示文字，直接點一下 +1
                addNum();
            }
        });

        // 取得計數器「起始值」
        window.addEventListener("DOMContentLoaded", () => {
            const startNum = localStorage.getItem("count1_Value");

            if (startNum !== null) {
                document.getElementById("count-times").innerText = startNum;
            }
        });

        function resetToZero() {
            document.getElementById("count-times").innerText = 0;
            localStorage.setItem("count1_Value", 0);
        }

        // #countNum 數字+1
        function addNum() {
            const n = document.getElementById("count-times");
            if (!n) return;
            const newNum = parseInt(n.textContent, 10) + 1;
            n.innerText = newNum;
            // 每次增加時同步存入 localStorage
            localStorage.setItem("count1_Value", newNum);
        }

        // <!-- ★ 修改：按鍵觸發同樣加入展開狀態判斷 -->
        document.addEventListener("keydown", (e) => {
            const isSpace = e.code === "Space" || e.key === " ";
            const isCtrl = e.key === "Control";

            if (isSpace || isCtrl) {
                e.preventDefault(); 
                if (e.repeat) return; 

                const bannerCenter = document.querySelector('.banner-center');
                const isBannerActive = bannerCenter && bannerCenter.classList.contains('active');

                if (isBannerActive) {
                    // 【展開狀態】：顯示文字 + 一輪計數
                    showFloatingText();
                    currentIndex = (currentIndex + 1) % textArray.length;

                    if (currentIndex === 0) {
                        addNum();
                    }

                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        currentIndex = 0;
                    }, 2000);
                } else {
                    // 【關閉狀態】：直接 +1
                    addNum();
                }
            }
        });

        // 加總所有計數器
        function sumAllcounters() {
            const a = parseInt(localStorage.getItem("count1_Value"), 10) || 0;
            const b = parseInt(localStorage.getItem("count2_Value"), 10) || 0;
            const c = parseInt(localStorage.getItem("count3_Value"), 10) || 0;
            const d = parseInt(localStorage.getItem("count4_Value"), 10) || 0;
            
            const sumAll = a + b + c + d;

            localStorage.setItem("count1_Value", sumAll);
            localStorage.setItem("count2_Value", 0);
            localStorage.setItem("count3_Value", 0);
            localStorage.setItem("count4_Value", 0);

            document.getElementById("count-times").innerText = sumAll;
        }

        // 省電模式切換
        function toggleTheme() {
            const container = document.getElementById("area-count");
            container.classList.toggle("dark-theme");

            const topText = document.getElementById("top");
            if (container.classList.contains("dark-theme")) {
                topText.textContent = "計數器";
            } else {
                topText.textContent = "歡迎光臨";
            }
        }

        // 長按修改數字區
        let pressTimer = null;
        const longPressDuration = 1500; 

        count.addEventListener("mousedown", startLongPress);
        count.addEventListener("touchstart", startLongPress);

        count.addEventListener("mouseup", cancelLongPress);
        count.addEventListener("mouseleave", cancelLongPress);
        count.addEventListener("touchend", cancelLongPress);
        count.addEventListener("touchmove", cancelLongPress); 

        function startLongPress(e) {
            cancelLongPress();

            pressTimer = setTimeout(() => {
                showPromptInput();
            }, longPressDuration);
        }

        function cancelLongPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        // 彈出視窗輸入並改變數字
        function showPromptInput() {
            const n = document.getElementById("count-times");
            const currentVal = n.textContent;

            let userInput = prompt("請輸入欲修正的「數量(數字)」：", currentVal);

            if (userInput !== null) {
                let parsedNum = parseInt(userInput, 10);

                if (!isNaN(parsedNum)) {
                    n.innerText = parsedNum;
                    localStorage.setItem("count1_Value", parsedNum);
                } else {
                    alert("請輸入有效的「數字」！");
                }
            }
        }

        // 滑動跳頁轉換功能
        function toggleBanner() {
            document.querySelector('.banner-center').classList.toggle('active');
            document.querySelector('.banner-foot').classList.toggle('active');
        }

        let startX = 0;
        let endX = 0;
        const minDistance = 250;

        document.addEventListener('touchstart', function (e) {
            startX = e.touches[0].clientX;
        }, false);

        document.addEventListener('touchend', function (e) {
            endX = e.changedTouches[0].clientX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            let distance = endX - startX;

            if (Math.abs(distance) > minDistance) {
                toggleBanner();
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
                toggleBanner();
            }
        });
